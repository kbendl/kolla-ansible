---
kolla_selinux_policies_loadbalancer:
  haproxy:
    enabled: "{{ enable_haproxy | default(true) | bool }}"
    groups:
      - "network"
      - "control"
    description: "SELinux domain for HAProxy"
    domain: "kolla_haproxy_t"
    exec_type: "kolla_haproxy_exec_t"
    requires:
      - "type container_runtime_t;"
      - "type port_t;"
      - "type node_t;"
      - "type proc_t;"
      - "type unreserved_port_t;"
      - "type glance_port_t;"
      - "type soundd_port_t;"
      - "type commplex_main_port_t;"
      - "type neutron_port_t;"
      - "type http_cache_port_t;"
      - "type geneve_port_t;"
      - "type amqp_port_t;"
      - "type osapi_compute_port_t;"
      - "type ntop_port_t;"
      - "type tor_port_t;"
      - "type wap_wsp_port_t;"
      - "type http_port_t;"
      - "type hplip_port_t;"
      - "class capability { net_bind_service setgid setuid sys_chroot net_admin };"
      - "class tcp_socket { name_bind name_connect node_bind listen };"
      - "class file { read open getattr };"
    allow_rules:
      - "allow kolla_haproxy_t self:capability { net_bind_service setgid setuid sys_chroot net_admin };"
      - "allow kolla_haproxy_t port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t node_t:tcp_socket node_bind;"
      # HAProxy binds frontends and healthchecks connect to backend OpenStack services
      - "allow kolla_haproxy_t unreserved_port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t glance_port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t soundd_port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t commplex_main_port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t neutron_port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t http_cache_port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t geneve_port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t amqp_port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t osapi_compute_port_t:tcp_socket { name_bind name_connect };"
      # Designate API (port 9001, labeled tor_port_t)
      - "allow kolla_haproxy_t tor_port_t:tcp_socket { name_bind name_connect };"
      # OpenSearch (port 9200, labeled wap_wsp_port_t)
      - "allow kolla_haproxy_t wap_wsp_port_t:tcp_socket { name_bind name_connect };"
      # Grafana (port 3000, labeled ntop_port_t)
      - "allow kolla_haproxy_t ntop_port_t:tcp_socket { name_bind name_connect };"
      # HTTP/HTTPS and other service frontends
      - "allow kolla_haproxy_t http_port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_haproxy_t hplip_port_t:tcp_socket { name_bind name_connect };"
      # HAProxy accepts client connections on its frontends
      - "allow kolla_haproxy_t self:tcp_socket listen;"
      # Healthcheck tools (curl) need to read /proc/filesystems
      - "allow kolla_haproxy_t proc_t:file { read open getattr };"

  keepalived:
    enabled: "{{ enable_keepalived | default(true) | bool }}"
    groups:
      - "network"
      - "control"
    description: "SELinux domain for Keepalived VIP Management"
    domain: "kolla_keepalived_t"
    exec_type: "kolla_keepalived_exec_t"
    requires:
      - "type container_runtime_t;"
      - "class capability { net_admin net_raw net_bind_service };"
      - "class rawip_socket { create bind setopt write read };"
    allow_rules:
      - "allow kolla_keepalived_t self:capability { net_admin net_raw net_bind_service };"
      - "allow kolla_keepalived_t self:rawip_socket { create bind setopt write read };"
