---
kolla_selinux_policies_memcached:
  memcached:
    enabled: "{{ enable_memcached | default(true) | bool }}"
    # Caching is centralized on the core control plane
    groups:
      - "control"
    description: "Dedicated SELinux domain for Memcached"
    domain: "kolla_memcached_t"
    exec_type: "kolla_memcached_exec_t"
    requires:
      - "type container_runtime_t;"
      - "type port_t;"
      - "type proc_t;"
      - "class tcp_socket { name_bind name_connect };"
      - "class file { read open };"
      - "class netlink_tcpdiag_socket { nlmsg_read };"
    allow_rules:
      - "allow kolla_memcached_t port_t:tcp_socket { name_bind name_connect };"
      # Healthcheck tools (pgrep, ss) need /proc access
      - "allow kolla_memcached_t proc_t:file { read open };"
      # Healthcheck tools (ss) need to query TCP socket diagnostics
      - "allow kolla_memcached_t self:netlink_tcpdiag_socket nlmsg_read;"
