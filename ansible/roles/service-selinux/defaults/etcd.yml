---
kolla_selinux_policies_etcd:
  etcd:
    enabled: "{{ enable_etcd | default(false) | bool }}"
    groups:
      - "control"
    description: "SELinux domain for etcd distributed key-value store"
    domain: "kolla_etcd_t"
    exec_type: "kolla_etcd_exec_t"
    requires:
      - "type container_runtime_t;"
      - "type port_t;"
      - "type proc_t;"
      - "class tcp_socket { name_bind name_connect };"
      - "class file { read open getattr };"
    allow_rules:
      - "allow kolla_etcd_t port_t:tcp_socket { name_bind name_connect };"
      - "allow kolla_etcd_t proc_t:file { read open getattr };"
